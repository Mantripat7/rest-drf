{% extends 'base.html' %}

{% block content %}

<div class="container my-5">
    <h1 class="text-primary text-center"> Update Profile </h1>
<form class="row g-3" method="post" enctype="multipart/form-data">
    {% csrf_token %}
   <div class="row g-3 col-10">

      <div class="col-md-6">
        <label for="inputEmail4" class="form-label">Name</label>
        <input type="text" class="form-control" name="name" value="{{ user.name }}">
      </div>
      <div class="col-md-6">
        <label for="inputPassword4" class="form-label">Email</label>
        <input type="email" class="form-control" name="email"  value="{{ user.email }}" readonly>
      </div>
      <div class="col-md-6">
        <label for="inputPassword4" class="form-label">10th Marks</label>
        <input type="number" class="form-control" name="marks"  value="{{ profile.matriculation_marks }}" required>
      </div>
      <div class="col-md-6">
        <label for="inputPassword4" class="form-label">DOB</label>
    
<input type="date" class="form-control" name="dob" value="{{ profile.dob|date:'Y-m-d' }}" required>

      </div>
      <div class="col-12">
        <label for="inputAddress2" class="form-label">Address </label>
        <input type="text" class="form-control" name="address" value="{{ user.address }}">
      </div>

   </div> 
  <div class="col-2">
    <div>
       {% if profile.pic %}
       <img src="{{  profile.pic.url  }}" height="100" width="100">
       {% endif %}
    <br>
    <label for="inputAddress2" class="form-label">Profile pic </label>
    <input type="file" class="form-control" name="pic" >
    </div>
      <div>
     {% if profile.docs %}
    <label for="inputAddress2" class="form-label">Docs  <a href="{{ profile.docs.url }}">Click to Open</a>   </label>
    <input type="file" class="form-control" name="docs" >
    {% else %}
    <label for="inputAddress2" class="form-label">Upload your docs here  </label>
    <input type="file" class="form-control" name="docs" >
    {% endif %}
    </div>
  </div>

 
  
  <div class="col-12">
    <button type="submit" class="btn btn-primary">Update</button>
  </div>
</form> 
</div>



{% endblock %}
