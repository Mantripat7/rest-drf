{% extends 'base.html' %}
{% block content %}

<div class="container">
    <h2>My courses </h2>

    <div class="mt-3 d-flex gap-2">
      {% for course in mycourses %}
      <div class="card col-3">
      <img src="{{ course.img.url }}" class="img-responsive" alt="..." style="width:240px; height:200px" >
         <div class="card-body">
            <h5 class="card-title">{{ course.name }}</h5>
            <p class="card-text">{{ course.desc }}</p>
            <a href="#" class="btn btn-primary">Start Now</a>
         </div>
      </div>
      {% empty %}
      There is no course you have enrolled yet.
      {% endfor %}
   </div>
    
    
    
  
</div>





{% endblock %}
